# 전체적으로 해당 옵션이 왜 필요한지 이해하는 과정이 필요해보임. 우선은 구현과 돌아가는지에 집중했음.

services:

  # ── Zookeeper ──────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "cub zk-ready localhost:2181 5"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s
    networks:
      - lakehouse

  # ── Kafka broker ──────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"  # 호스트: localhost:9092 / 컨테이너 간: kafka:29092
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # 내부(컨테이너 간): PLAINTEXT://kafka:29092
      # 외부(호스트):      PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - lakehouse

  # ── Producer ──────────────────────────────────────────────────────────────
  # producer.py가 main() 첫 번째 동작으로 create_topics()를 호출해 토픽을 생성
  # → kafka-to-raw는 producer: service_started에 의존해 토픽이 생성된 후 시작되도록 순서 보장
  # race condition 대비: kafka-to-raw에 restart: on-failure 추가 (아래 참고)
  producer:
    build:
      context: .
    container_name: producer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: "kafka:29092"
      HF_HOME: "/app/hf_cache"
    volumes:
      - hf_cache:/app/hf_cache   # 재시작해도 데이터셋 재다운로드 안 함
    networks:
      - lakehouse


  # ── Kafka UI ──────────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - lakehouse

  # Spark 환경 구성에서 dockerfile 내용(왜 이렇게 작성해야 하는지)이나
  # 구체적인 yaml 내용 흐름 이해하진 못했음.(해당 설정 왜 필요?) 우선 돌아가는지에 집중.

  # ── Spark Master ──────────────────────────────────────────────────────────
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: spark-master
    # hostname을 서비스명과 동일하게 고정 - 미설정 시 Docker가 랜덤 해시를 할당해
    # Master가 자신의 주소를 랜덤 해시로 광고 → Worker/Driver가 해당 주소로 역접속 실패
    hostname: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master
    environment:
      SPARK_NO_DAEMONIZE: "true"   # 포그라운드 실행 강제 - 없으면 컨테이너가 즉시 종료됨
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    ports:
      - "8080:8080"   # Spark Master Web UI: http://localhost:8080
      - "7077:7077"   # Worker / spark-submit 연결 포트
    networks:
      - lakehouse

  # ── Spark Worker × 3 ──────────────────────────────────────────────────────
  # worker당 3코어 × 3worker = 9코어 총합
  # impression/click: 3코어 각각 (파티션 3개 완전 병렬)
  # conversion: 1코어 (메시지 빈도 가장 적어 단일 executor로 충분) → 절약 2코어를 raw-to-processed 배치에 할당
  spark-worker-1:
    build:
      context: .
      dockerfile: Dockerfile.spark  # Driver와 동일한 JAR 환경 — ClassNotFoundException 방지
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_MEMORY: 3g
      SPARK_WORKER_CORES: 3
    depends_on:
      - spark-master
    networks:
      - lakehouse

  spark-worker-2:
    build:
      context: .
      dockerfile: Dockerfile.spark
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_MEMORY: 3g
      SPARK_WORKER_CORES: 3
    depends_on:
      - spark-master
    networks:
      - lakehouse

  spark-worker-3:
    build:
      context: .
      dockerfile: Dockerfile.spark
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_MEMORY: 3g
      SPARK_WORKER_CORES: 3
    depends_on:
      - spark-master
    networks:
      - lakehouse

  # ── kafka_to_raw 스트리밍 job (Spark Driver × 3) ─────────────────────────
  # 토픽당 컨테이너 1개 = 프로세스 1개 = spark-submit 1회
  # → 컨테이너 단위 restart: on-failure로 토픽별 독립 재시작
  # impression 3코어 + click 3코어 + conversion 1코어 = 7코어
  # 나머지 2코어 → raw-to-processed 배치 job용으로 예약

  x-kafka-to-raw-common: &kafka-to-raw-common
    build:
      context: .
      dockerfile: Dockerfile.spark
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      S3_RAW_BASE: s3a://metacode-criteo-project/raw
      CHECKPOINT_BASE: s3a://metacode-criteo-project/checkpoints/kafka_to_raw
      # AWS 자격증명 - .env 파일 또는 호스트 환경변수에서 주입 (코드에 하드코딩 금지)
      # 사용법: AWS_ACCESS_KEY_ID=... AWS_SECRET_ACCESS_KEY=... docker compose up
      # EC2 환경이라면 IAM Role로 대체 가능
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-northeast-2}
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
    volumes:
      - ./:/app   # 개발 편의상 마운트 — 운영에서는 Dockerfile COPY로 전환
    depends_on:
      kafka:
        condition: service_healthy    # Kafka 미준비 → readStream 연결 실패
      producer:
        condition: service_started    # 토픽 미존재 → 구독 실패
      spark-master:
        condition: service_healthy    # Master 미준비 → spark-submit 연결 실패
    restart: on-failure
    networks:
      - lakehouse

  kafka-to-raw-impression:
    <<: *kafka-to-raw-common
    container_name: kafka-to-raw-impression
    command: >
      /opt/spark/bin/spark-submit
        --master spark://spark-master:7077
        --conf spark.cores.max=3
        --conf spark.executor.cores=1
        --conf spark.executor.memory=800m
        /app/kafka_to_raw.py --topic-type impression
    ports:
      - "4040:4040"   # Spark Driver Web UI: http://localhost:4040

  kafka-to-raw-click:
    <<: *kafka-to-raw-common
    container_name: kafka-to-raw-click
    command: >
      /opt/spark/bin/spark-submit
        --master spark://spark-master:7077
        --conf spark.cores.max=3
        --conf spark.executor.cores=1
        --conf spark.executor.memory=800m
        /app/kafka_to_raw.py --topic-type click
    ports:
      - "4041:4040"   # Spark Driver Web UI: http://localhost:4041

  kafka-to-raw-conversion:
    <<: *kafka-to-raw-common
    container_name: kafka-to-raw-conversion
    command: >
      /opt/spark/bin/spark-submit
        --master spark://spark-master:7077
        --conf spark.cores.max=1
        --conf spark.executor.cores=1
        --conf spark.executor.memory=800m
        /app/kafka_to_raw.py --topic-type conversion
    ports:
      - "4042:4040"   # Spark Driver Web UI: http://localhost:4042

  # ── raw_to_processed 일배치 job ────────────────────────────────────────────
  # profiles: [batch] — docker compose up 시 자동 기동 안 함
  # 수동 실행: AWS_ACCESS_KEY_ID=... AWS_SECRET_ACCESS_KEY=... docker compose --profile batch run --rm raw-to-processed
  # 날짜 범위 재처리: ... run --rm raw-to-processed /opt/spark/bin/spark-submit ... --run-date-start 2024-01-01 --run-date-end 2024-01-07
  raw-to-processed:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: raw-to-processed
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-northeast-2}
      AWS_REGION: ${AWS_DEFAULT_REGION:-ap-northeast-2} 
      S3_RAW_BASE: s3a://metacode-criteo-project/raw
      GLUE_WAREHOUSE: s3a://metacode-criteo-project/warehouse
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
    volumes:
      - ./:/app
    command: >
      /opt/spark/bin/spark-submit
        --master spark://spark-master:7077
        --conf spark.cores.max=2
        --conf spark.executor.cores=1
        --conf spark.executor.memory=1g
        /app/raw_to_processed_iceberg.py
    depends_on:
      spark-master:
        condition: service_healthy
    networks:
      - lakehouse
    profiles:
      - batch

  # ── processed_to_campaign_summary 일배치 job (Gold) ────────────────────────
  # profiles: [batch] — docker compose up 시 자동 기동 안 함
  # 수동 실행: AWS_ACCESS_KEY_ID=... AWS_SECRET_ACCESS_KEY=... docker compose --profile batch run --rm processed-to-summary
  # 날짜 지정 재처리: ... run --rm processed-to-summary /opt/spark/bin/spark-submit ... --run-date-end 2026-06-07
  processed-to-summary:
    build:
      context: .
      dockerfile: Dockerfile.spark
    container_name: processed-to-summary
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-northeast-2}
      AWS_REGION: ${AWS_DEFAULT_REGION:-ap-northeast-2}
      GLUE_WAREHOUSE: s3a://metacode-criteo-project/warehouse
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
    volumes:
      - ./:/app
    command: >
      /opt/spark/bin/spark-submit
        --master spark://spark-master:7077
        --conf spark.cores.max=2
        --conf spark.executor.cores=1
        --conf spark.executor.memory=1g
        /app/processed_to_campaign_summary.py
    depends_on:
      spark-master:
        condition: service_healthy
    networks:
      - lakehouse
    profiles:
      - batch

networks:
  lakehouse:
    driver: bridge

volumes:
  hf_cache:
